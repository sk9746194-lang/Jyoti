
name: Build MYRA Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant Gradle Permission
        working-directory: MYRA_Android_Project
        run: chmod +x gradlew

      - name: Build MYRA Debug APK
        working-directory: MYRA_Android_Project
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload MYRA APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-Assistant-Debug-APK
          path: MYRA_Android_Project/app/build/outputs/apk/debug/*.apk
          retention-days: 14
