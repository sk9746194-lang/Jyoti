name: MYRA Android ZIP Extract, Archive and APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - myra-android-ci
    paths:
      - "MYRA_ANDROID_AUDITED_FINAL.zip"
      - ".github/workflows/myra-android-build.yml"

permissions:
  contents: write

jobs:
  extract-and-build:
    name: Extract MYRA source and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source ZIP
        run: |
          test -s MYRA_ANDROID_AUDITED_FINAL.zip
          unzip -t MYRA_ANDROID_AUDITED_FINAL.zip

      - name: Extract MYRA Android project
        run: |
          mkdir -p .myra-ci
          unzip -q MYRA_ANDROID_AUDITED_FINAL.zip -d .myra-ci
          test -f .myra-ci/MYRA_Android_Project/settings.gradle.kts
          test -f .myra-ci/MYRA_Android_Project/gradlew
          test -f .myra-ci/MYRA_Android_Project/app/build.gradle.kts
          rm -rf MYRA_Android_Project
          cp -a .myra-ci/MYRA_Android_Project ./MYRA_Android_Project
          echo "Extracted project files:"
          find MYRA_Android_Project -type f | sort

      - name: Commit extracted project into GitHub branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MYRA_Android_Project/
          if git diff --cached --quiet; then
            echo "Extracted project is already up to date."
          else
            git commit -m "Extract MYRA Android project into repository"
            git push origin HEAD:myra-android-ci
          fi

      - name: Upload extracted Android project
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-EXTRACTED-ANDROID-SOURCE
          path: MYRA_Android_Project/
          if-no-files-found: error
          retention-days: 30

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;34.0.0"

      - name: Build Debug APK
        working-directory: MYRA_Android_Project
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:clean :app:assembleDebug

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-Assistant-Debug-APK
          path: MYRA_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
