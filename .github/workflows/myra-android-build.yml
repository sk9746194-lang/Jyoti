name: MYRA Android ZIP Extract, Archive and APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - myra-android-ci
    paths:
      - "MYRA_ANDROID_AUDITED_FINAL.zip"
      - ".github/workflows/myra-android-build.yml"

permissions:
  contents: read

jobs:
  extract-and-build:
    name: Extract MYRA source and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source ZIP
        run: |
          test -s MYRA_ANDROID_AUDITED_FINAL.zip
          unzip -t MYRA_ANDROID_AUDITED_FINAL.zip

      - name: Extract MYRA Android project
        run: |
          mkdir -p .myra-ci
          unzip -q MYRA_ANDROID_AUDITED_FINAL.zip -d .myra-ci
          test -f .myra-ci/MYRA_Android_Project/settings.gradle.kts
          test -f .myra-ci/MYRA_Android_Project/gradlew
          test -f .myra-ci/MYRA_Android_Project/app/build.gradle.kts
          echo "Extracted project files:"
          find .myra-ci/MYRA_Android_Project -maxdepth 3 -type f | sort | head -100

      - name: Upload extracted Android project
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-EXTRACTED-ANDROID-SOURCE
          path: .myra-ci/MYRA_Android_Project/
          if-no-files-found: error
          retention-days: 30

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools,platforms;android-34,build-tools;34.0.0"

      - name: Build Debug APK
        working-directory: .myra-ci/MYRA_Android_Project
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:clean :app:assembleDebug

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-Assistant-Debug-APK
          path: .myra-ci/MYRA_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
