name: MYRA ZIP Extract and Android Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/myra-extract-build.yml"
      - "MYRA_SMART_GEMINI_API_COMPLETE.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract MYRA ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f MYRA_SMART_GEMINI_API_COMPLETE.zip
          echo "=== ZIP file ==="
          ls -lh MYRA_SMART_GEMINI_API_COMPLETE.zip
          echo "=== ZIP contents ==="
          unzip -Z1 MYRA_SMART_GEMINI_API_COMPLETE.zip | tee ZIP_CONTENTS.txt
          mkdir -p MYRA_EXTRACTED
          unzip -oq MYRA_SMART_GEMINI_API_COMPLETE.zip -d MYRA_EXTRACTED
          echo "=== Extracted files ==="
          find MYRA_EXTRACTED -maxdepth 5 -type f | sort | tee EXTRACTED_FILES.txt
          echo "=== Project manifests ==="
          find MYRA_EXTRACTED -maxdepth 6 \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts -o -name gradlew -o -name pubspec.yaml -o -name package.json \) -type f -print

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK when Gradle wrapper exists
        shell: bash
        run: |
          set -euo pipefail
          WRAPPER="$(find MYRA_EXTRACTED -type f -name gradlew -print -quit || true)"
          if [ -z "$WRAPPER" ]; then
            echo "No Gradle wrapper found in the extracted ZIP; extraction completed, APK build skipped."
            exit 0
          fi
          PROJECT_DIR="$(dirname "$WRAPPER")"
          echo "Building Android project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload extracted project and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-EXTRACTED-PROJECT-AND-REPORTS
          path: |
            MYRA_EXTRACTED/
            ZIP_CONTENTS.txt
            EXTRACTED_FILES.txt
            **/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
