name: MYRA ZIP Extract and Android Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/myra-extract-build.yml"
      - "MYRA_SMART_GEMINI_API_COMPLETE.zip"
      - "MYRA_EXTRACTED/**"
  pull_request:
    branches: [main]
    paths:
      - "MYRA_EXTRACTED/**"
      - ".github/workflows/myra-extract-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract MYRA ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f MYRA_SMART_GEMINI_API_COMPLETE.zip
          echo "=== ZIP file ==="
          ls -lh MYRA_SMART_GEMINI_API_COMPLETE.zip
          echo "=== ZIP contents ==="
          unzip -Z1 MYRA_SMART_GEMINI_API_COMPLETE.zip | tee ZIP_CONTENTS.txt
          if [ ! -f MYRA_EXTRACTED/gradlew ]; then
            echo "No committed extracted project found; extracting the original ZIP once."
            mkdir -p MYRA_EXTRACTED
            unzip -oq MYRA_SMART_GEMINI_API_COMPLETE.zip -d MYRA_EXTRACTED
          else
            echo "Using committed MYRA_EXTRACTED source; preserving tracked fixes instead of overwriting from the original ZIP."
          fi
          echo "=== Extracted files ==="
          find MYRA_EXTRACTED -maxdepth 5 -type f | sort | tee EXTRACTED_FILES.txt
          echo "=== Project manifests ==="
          find MYRA_EXTRACTED -maxdepth 6 \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts -o -name gradlew -o -name pubspec.yaml -o -name package.json \) -type f -print

      - name: Commit extracted MYRA source into repository
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MYRA_EXTRACTED ZIP_CONTENTS.txt EXTRACTED_FILES.txt
          if git diff --cached --quiet; then
            echo "Extracted source is already committed; no repository update needed."
          else
            git commit -m "Extract MYRA Android project from ZIP"
            git push origin HEAD:main
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build main MYRA app and Companion app
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Build main MYRA Android app ==="
          cd MYRA_EXTRACTED
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "=== Main MYRA APK ==="
          find app/build/outputs/apk -type f -name '*.apk' -print

          echo "=== Build MYRA Companion Android app ==="
          cd MYRA_Companion_Project
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "=== Companion APK ==="
          find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload extracted project and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-EXTRACTED-PROJECT-AND-REPORTS
          path: |
            MYRA_EXTRACTED/
            ZIP_CONTENTS.txt
            EXTRACTED_FILES.txt
            **/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
