
name: Build MYRA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MYRA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Check Android project
        id: android
        shell: bash
        run: |
          if [ -f android/gradlew ] && [ -d android/app ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ -f app/gradlew ] && [ -d app/app ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "path=app" >> "$GITHUB_OUTPUT"
          else
            echo "No standard Android Gradle project found."
            echo "Inspect repository structure and configure Android build."
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: |
          cd "${{ steps.android.outputs.path || 'android' }}"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-debug-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
