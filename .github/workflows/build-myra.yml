      - name: Normalize repeated source patches before build
        working-directory: MYRA_SOURCE
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Remove duplicate wake-service action constants left by repeated patch runs.
          wake = Path("app/src/main/java/com/myra/assistant/services/MyraWakeWordService.kt")
          if wake.exists():
              ws = wake.read_text()
              for declaration in (
                  '        const val ACTION_PAUSE_LISTENING = "com.myra.assistant.ACTION_PAUSE_WAKE_LISTENING"',
                  '        const val ACTION_RESUME_LISTENING = "com.myra.assistant.ACTION_RESUME_WAKE_LISTENING"',
              ):
                  first = ws.find(declaration)
                  if first >= 0:
                      tail = ws[first + len(declaration):].replace("\n" + declaration, "")
                      ws = ws[:first + len(declaration)] + tail
              wake.write_text(ws)

          # Earlier patch attempts could be applied repeatedly to an already
          # patched ZIP. Collapse duplicate declarations and repeated edits.
          wake = Path("app/src/main/java/com/myra/assistant/services/MyraWakeWordService.kt")
          ws = wake.read_text()
          seen = set()
          kept = []
          for line in ws.splitlines():
              stripped = line.strip()
              if stripped.startswith("const val ACTION_PAUSE_LISTENING =") or stripped.startswith("const val ACTION_RESUME_LISTENING ="):
                  if stripped in seen:
                      continue
                  seen.add(stripped)
              kept.append(line)
          wake.write_text("\n".join(kept) + "\n")
          p = Path("app/src/main/java/com/myra/assistant/security/SecureKeyStorage.kt")
          s = p.read_text()
          line = '        private const val KEY_HUGGING_FACE_TOKEN = "encrypted_hugging_face_read_token"'
          while s.count(line) > 1:
              pos = s.find(line, s.find(line) + len(line))
              s = s[:pos] + s[pos + len(line):]
          p.write_text(s)

          p = Path("app/src/main/java/com/myra/assistant/ui/screens/MainVoiceScreen.kt")
          s = p.read_text()
          line = '    val prefs = remember { PreferencesManager(context) }'
          while s.count(line) > 1:
              pos = s.find(line, s.find(line) + len(line))
              s = s[:pos] + s[pos + len(line):]
          p.write_text(s)

          p = Path("app/src/main/java/com/myra/assistant/voice/SystemSpeechEngine.kt")
          s = p.read_text()
          block = """            val queuedSpeech = pendingSpeech
              pendingSpeech = null
              if (queuedSpeech != null) {
                  mainHandler.post { speak(queuedSpeech.first, queuedSpeech.second, queuedSpeech.third) }
              }"""
          # Remove immediately repeated queue-drain blocks, retaining one.
          doubled = block + "\n" + block
          while doubled in s:
              s = s.replace(doubled, block)
          # Normalize indentation variants emitted by prior patch passes.
          s = re.sub(r'(\n\s*val queuedSpeech = pendingSpeech\n\s*pendingSpeech = null\n\s*if \(queuedSpeech != null\) \{\n\s*mainHandler\.post \{ speak\(queuedSpeech\.first, queuedSpeech\.second, queuedSpeech\.third\) \}\n\s*\}){2,}',
                     lambda m: m.group(1), s)
          p.write_text(s)

          p = Path("app/src/main/java/com/myra/assistant/offline/OfflineCommandEngine.kt")
          s = p.read_text()
          s = re.sub(r'val launched = appLauncher\.launchAppByName\(appName\)(?:\.success)*',
                     'val launched = appLauncher.launchAppByName(appName).success', s)
          p.write_text(s)

          print("Repeated patch declarations normalized.")
          PY
