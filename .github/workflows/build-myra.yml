          personality_method = """    fun updatePersonality(newPersonality: String) {
                  currentPersonality = newPersonality
                  val systemPromptText = when (newPersonality) {
                      "romantic_gf" -> "You are MYRA in GF / AI Companion Mode. Be warm, caring, respectful and emotionally supportive in natural Hindi/Hinglish. Address the user affectionately as $currentCompanionNickname when appropriate. Do not claim to be human or encourage dependency."
                      "professional" -> "You are MYRA in Professional Executive Mode. Provide crisp, structured, formal, concise answers in clear Hindi and English."
                      else -> "You are MYRA, a friendly Indian Android voice assistant. Speak naturally in Hindi and Hinglish, keep spoken responses concise, conversational and helpful."
                  }
                  if (isGoogleBidiEndpoint) {
                      val payload = JSONObject().apply {
                          put("contextUpdate", JSONObject().apply {
                              put("systemInstruction", JSONObject().apply {
                                  put("parts", JSONArray().apply {
                                      put(JSONObject().apply { put("text", systemPromptText) })
                                  })
                              })
                          })
                      }
                      val sent = webSocket?.send(payload.toString()) == true
                      Log.i(tag, "Gemini Live system instruction update sent=$sent personality=$newPersonality")
                  } else {
                      val payload = JsonObject().apply {
                          addProperty("type", "update_personality")
                          addProperty("personality", newPersonality)
                          addProperty("voiceName", currentVoiceName)
                          addProperty("nickname", currentCompanionNickname)
                      }
                      webSocket?.send(payload.toString())
                  }
              }
          """
          s = s[:start] + personality_method + s[end:]
          
          if 'if (root.has("toolCall"))' not in s:
              anchor = '        if (root.has("serverContent")) {'
              if anchor not in s:
                  raise SystemExit("Gemini Live serverContent parser anchor was not found")
              s = s.replace(anchor, """        if (root.has("toolCall")) {
                      handleGoogleToolCall(root.getJSONObject("toolCall"))
                      return
                  }
          
          """ + anchor, 1)
          
          if "private fun handleGoogleToolCall(" not in s:
              marker = "    private fun calculatePcmRms(pcmBytes: ByteArray) {"
              if marker not in s:
                  raise SystemExit("Gemini Live PCM method marker was not found")
              methods = """    private fun handleGoogleToolCall(toolCall: JSONObject) {
                  val calls = toolCall.optJSONArray("functionCalls") ?: return
                  for (i in 0 until calls.length()) {
                      val call = calls.optJSONObject(i) ?: continue
                      val callId = call.optString("id")
                      val name = call.optString("name")
                      val argsJson = call.optJSONObject("args") ?: JSONObject()
                      val args = mutableMapOf<String, Any?>()
                      val keys = argsJson.keys()
                      while (keys.hasNext()) {
                          val key = keys.next()
                          val value = argsJson.opt(key)
                          args[key] = if (value == JSONObject.NULL) null else value
                      }
                      if (callId.isBlank() || name.isBlank()) {
                          Log.e(tag, "Gemini Live returned a function call without id/name")
                      } else {
                          try {
                              onFunctionCall(name, args, callId)
                          } catch (e: Exception) {
                              sendFunctionResponse(callId, name, false, "Action failed: " + e.message)
                          }
                      }
                  }
              }
          
              fun sendFunctionResponse(id: String, name: String, success: Boolean, message: String, detail: String = "") {
                  if (!isGoogleBidiEndpoint || webSocket == null) {
                      Log.w(tag, "Cannot send tool response: Gemini Live socket is not active")
                      return
                  }
                  val result = JSONObject().apply {
                      put("success", success)
                      put("message", message)
                      if (detail.isNotBlank()) put("detail", detail)
                  }
                  val payload = JSONObject().apply {
                      put("toolResponse", JSONObject().apply {
                          put("functionResponses", JSONArray().apply {
                              put(JSONObject().apply {
                                  put("id", id)
                                  put("name", name)
                                  put("response", result)
                              })
                          })
                      })
                  }
                  val sent = webSocket?.send(payload.toString()) == true
                  if (!sent) Log.e(tag, "Failed to send Gemini Live tool response for " + name)
              }
          
          """
              s = s.replace(marker, methods + marker, 1)
          
          engine.write_text(s)
          
          activity = Path("app/src/main/java/com/myra/assistant/MainActivity.kt")
          a = activity.read_text()
          if "onFunctionCall = { functionName, arguments, callId ->" not in a:
              pattern = r'(onStatusChanged = \{ connected, reason ->\s*voiceStatus = voiceStatus\.copy\(\s*fallbackActive = !connected,\s*fallbackReason = reason\s*\)\s*\})(\s*\))'
              match = re.search(pattern, a)
              if not match:
                  raise SystemExit("MainActivity Gemini Live status callback anchor was not found")
              callback = """
                                          onFunctionCall = { functionName, arguments, callId ->
                                              lifecycleScope.launch {
                                                  val outcome = executeFunctionCallOnAndroid(functionName, arguments)
                                                  liveEngine?.sendFunctionResponse(
                                                      callId, functionName, outcome.success, outcome.message, outcome.detail
                                                  )
                                              }
                                          }"""
              a = a[:match.start()] + match.group(1) + "," + callback + match.group(2) + a[match.end():]
          activity.write_text(a)
          
          print("Gemini Live tools, tool-call execution/response, and live GF-mode context updates patched.")
          
