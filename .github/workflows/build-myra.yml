          )
          p.write_text(s)

          p = root / "MYRA_Companion_Project/app/src/main/java/com/myra/companion/service/CompanionHotspotServer.kt"
          s = p.read_text()
          if "Request body too large" not in s:
              anchor = "                val body = if (contentLength > 0) {"
              guard = "\n".join([
                  "                if (contentLength > 1_048_576) {",
                  '                    val errorBytes = """{"status":"error","message":"Request body too large"}""".toByteArray(Charsets.UTF_8)',
                  '                    writer.write("HTTP/1.1 413 Payload Too Large\\r\\nContent-Length: " + errorBytes.size + "\\r\\nConnection: close\\r\\n\\r\\n")',
                  "                    writer.flush()",
                  "                    s.getOutputStream().write(errorBytes)",
                  "                    s.getOutputStream().flush()",
                  "                    return",
                  "                }",
                  "",
                  "                val body = if (contentLength > 0) {"
              ])
              if anchor not in s:
                  raise SystemExit("Companion transport body-read anchor missing")
              s = s.replace(anchor, guard, 1)
          s = s.replace(
              "                        val fileSize = (header[\"fileSize\"] as? Number)?.toLong() ?: 0L\n                        val sha256",
              "                        val fileSize = (header[\"fileSize\"] as? Number)?.toLong() ?: 0L\n                        require(fileSize in 1..(50L * 1024 * 1024)) { \"File exceeds 50 MB limit\" }\n                        val sha256",
              1
          )
          s = s.replace(
              "                            incoming.fos.write(bytes)\n                            incoming.bytesWritten += bytes.size",
              "                            if (incoming.bytesWritten + bytes.size > incoming.fileSize) {\n                                throw IllegalArgumentException(\"Transfer exceeds declared file size\")\n                            }\n                            incoming.fos.write(bytes)\n                            incoming.bytesWritten += bytes.size",
              1
          )
          p.write_text(s)

          # Remove duplicate timeout lines from older source snapshots.
          s = p.read_text()
          s = re.sub(r'(?m)^(                s\.soTimeout = 5000\n){2,}', '                s.soTimeout = 5000\n', s)
          p.write_text(s)
          print("Added bounded socket reads, 1 MB request cap and 50 MB transfer limits.")
          print("Added paired-token checks for LAN gesture/file/screen routes, locked Companion command auth, draft-only WhatsApp in ActionBrain, honest unsupported-action results, and removed retiring model fallback.")

          # MYRA is BYOK direct-to-Google: never route normal chat through a custom backend.
          p = root / "app/src/main/java/com/myra/assistant/provider/AIProviderManager.kt"
          s = p.read_text()
          s = s.replace("    private val optionalBackendProvider = OptionalSecureBackendProvider(context)\n", "")
          backend_pattern = r'        // Step 1: Optional Custom Backend \(if user configured private server\).*?        // Step 2: Gemini Direct Provider \(Official Google API\)'
          direct_only = "        // Direct Google Gemini API only — no custom backend or separate backend login is required.\n        // Step 1: Gemini Direct Provider (Official Google API)"
          s, backend_matches = re.subn(backend_pattern, direct_only, s, count=1, flags=re.S)
          if backend_matches != 1 and "no custom backend or separate backend login is required" not in s:
              raise SystemExit("Optional backend routing block was not found; refusing to leave ambiguous routing.")
          if "optionalBackendProvider.executeChat" in s:
              raise SystemExit("Custom backend call remains in AIProviderManager.")
          p.write_text(s)

          # Explain the actual setup directly in Settings: paste the user's own key, no server setup.
          p = root / "app/src/main/java/com/myra/assistant/ui/screens/SettingsScreen.kt"
          s = p.read_text()
          old_notice = "Keys saved here are stored privately on this device and never exposed in APK or Git commits. For multi-user production apps, routing via a secure backend proxy (/api/gemini/*) is recommended to prevent client-side key reverse-engineering."
          new_notice = "MYRA सीधे Google Gemini API से जुड़ता है। आपको Render, VPS, Backend URL या अलग Backend Login की जरूरत नहीं है। अपनी Gemini API Key यहां Save और Test करें। Key फोन में encrypted storage में रखी जाती है; फोन सुरक्षित रखें और Key किसी से साझा न करें।"
          if old_notice in s:
              s = s.replace(old_notice, new_notice, 1)
          elif new_notice not in s:
              raise SystemExit("Settings API security notice not found.")
          p.write_text(s)

          # Keep the setup guide aligned with the direct-key-only app flow.
          p = root / "GEMINI_API_SETUP.md"
          if p.exists():
              s = p.read_text()
              if "Backend login is not required" not in s:
                  s += "\n\n## Current MYRA setup — direct API key only\n\nBackend login is not required. MYRA Android sends requests directly to the official Google Gemini API using the key you save in Settings > API Configuration. Do not deploy or configure the optional server for normal MYRA chat or voice use. The API key is encrypted at rest on the phone, but any key used by a client app can potentially be extracted from a compromised device; keep it private and set usage limits/restrictions in Google AI Studio/Cloud where available.\n"
              p.write_text(s)

          print("Applied secure key migration, fail-closed sensitive action checks, honest SOS results, lock-screen blocking, fake-data removal, API throttling, Live endpoint and model fallback updates, and microphone ownership safeguard.")
          PY

      - name: Upload patched MYRA source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-Patched-Source-Snapshot
          path: MYRA_SOURCE/
          if-no-files-found: error
          retention-days: 1
      - name: Update GitHub source ZIP with patched MYRA source
        if: success()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          root = Path("MYRA_SOURCE")
          output = Path("MYRA_EXTRACTED_SOURCE.zip")
          excluded_dirs = {".git", ".gradle", ".idea", "build", "node_modules", "dist", ".cache"}
          excluded_suffixes = {".apk", ".aab", ".class", ".log", ".jks", ".keystore", ".p12", ".pem"}
          with ZipFile(output, "w", ZIP_DEFLATED, compresslevel=9) as archive:
              for path in root.rglob("*"):
                  relative = path.relative_to(root)
                  if any(part in excluded_dirs for part in relative.parts):
                      continue
                  if not path.is_file() or path.name == "local.properties":
                      continue
                  if path.suffix.lower() in excluded_suffixes or path.name == ".env":
                      continue
                  archive.write(path, relative.as_posix())
          with ZipFile(output) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"Repacked ZIP failed CRC validation: {bad}")
              print(f"Repacked {len(archive.namelist())} source files ({output.stat().st_size} bytes).")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MYRA_EXTRACTED_SOURCE.zip
          if git diff --cached --quiet; then
            echo "Source ZIP already contains the validated fixes."
          else
            git commit -m "Update MYRA source ZIP with validated fixes [skip ci]"
            git push origin HEAD:main
          fi
      - name: Compile main app Kotlin only (no APK packaging)
        working-directory: MYRA_SOURCE
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
      - name: Compile companion app Kotlin only (no APK packaging)
        working-directory: MYRA_SOURCE/MYRA_Companion_Project
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
      - name: Build main app
        if: false
        working-directory: MYRA_SOURCE
        run: ./gradlew :app:clean :app:assembleDebug --no-daemon --stacktrace
      - name: Upload main APK and reports
        if: always() && false
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-Main-APK-or-Build-Logs
          path: |
            MYRA_SOURCE/app/build/outputs/apk/debug/app-debug.apk
            MYRA_SOURCE/app/build/reports/
            MYRA_SOURCE/build/reports/
          if-no-files-found: warn
          retention-days: 14
