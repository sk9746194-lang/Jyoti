name: Build MYRA APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-main:
    name: Build MYRA Main APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Extract source ZIP
        run: |
          unzip -q MYRA_EXTRACTED_SOURCE.zip -d MYRA_SOURCE
          chmod +x MYRA_SOURCE/gradlew
      - name: Align dependencies and repair MYRA source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("MYRA_SOURCE")
          root_gradle = root / "build.gradle.kts"
          app_gradle = root / "app/build.gradle.kts"

          s = root_gradle.read_text()
          s = s.replace('id("org.jetbrains.kotlin.android") version "1.9.23" apply false',
                        'id("org.jetbrains.kotlin.android") version "2.3.0" apply false\n    id("org.jetbrains.kotlin.plugin.compose") version "2.3.0" apply false')
          root_gradle.write_text(s)

          s = app_gradle.read_text()
          if 'id("org.jetbrains.kotlin.plugin.compose")' not in s:
              s = s.replace('    id("org.jetbrains.kotlin.android")',
                            '    id("org.jetbrains.kotlin.android")\n    id("org.jetbrains.kotlin.plugin.compose")')
          s = s.replace('com.google.ai.edge.litertlm:litertlm-android:0.1.0',
                        'com.google.ai.edge.litertlm:litertlm-android:0.18.0')
          s = re.sub(r'    composeOptions\s*\{[^}]*\}\s*', '', s)
          s = re.sub(r'    kotlinOptions\s*\{\s*jvmTarget\s*=\s*"17"\s*\}',
                     '    kotlin { compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) } }', s)
          app_gradle.write_text(s)

          main = root / "app/src/main/java/com/myra/assistant/MainActivity.kt"
          lines = main.read_text().splitlines()
          req = next((i for i, line in enumerate(lines) if 'Request error: ${e.message}' in line), -1)
          if req >= 0:
              first = req
              while first > 0 and "val cancelMsg = ChatMessage(" not in lines[first]:
                  first -= 1
              state = next((i for i in range(req, min(req + 8, len(lines))) if "assistantState = AssistantState.IDLE" in lines[i]), -1)
              if first < req and state >= 0:
                  del lines[first:state + 3]
          s = "\n".join(lines) + "\n"
          if "import androidx.compose.ui.unit.dp" not in s:
              s = s.replace("import androidx.compose.ui.Modifier",
                            "import androidx.compose.ui.Modifier\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp\nimport androidx.compose.ui.text.font.FontWeight")
          s = s.replace('prefs.currentMode == "romantic_gf"', 'prefs.personality == "romantic_gf"')
          s = s.replace("OrbThemeColor.ROMANTIC_ROSE", "OrbThemeColor.ROSE_GOLD")
          main.write_text(s)

          security = root / "app/src/main/java/com/myra/assistant/ui/screens/SecurityScreen.kt"
          s = security.read_text()
          if "import androidx.compose.ui.unit.dp" not in s:
              s = s.replace("import androidx.compose.ui.Modifier",
                            "import androidx.compose.ui.Modifier\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp")
          security.write_text(s)

          colors = root / "app/src/main/java/com/myra/assistant/ui/theme/Color.kt"
          s = colors.read_text()
          if "val AccentCyan =" not in s:
              s += "\n// Compatibility aliases for screen color names.\nval AccentCyan = CyanNeon\nval PurpleNeon = AccentIndigo\n"
          colors.write_text(s)

          settings = root / "app/src/main/java/com/myra/assistant/ui/screens/SettingsScreen.kt"
          s = settings.read_text()
          s = s.replace("WhatsAppAutomation.isAccessibilityActive(context)", "WhatsAppAutomation(context).isAccessibilityActive()")
          s = s.replace("WhatsAppAutomation.isInstalled(context)", "WhatsAppAutomation(context).isInstalled()")
          s = s.replace("WhatsAppAutomation.openAccessibilitySettings(context)", "WhatsAppAutomation(context).openAccessibilitySettings()")
          settings.write_text(s)

          # Fix API/model mismatches found by the Kotlin compiler.
          p = root / "app/src/main/java/com/myra/assistant/MainActivity.kt"
          s = p.read_text()
          s = s.replace("history = contextHistory.map { it.sender to it.text },", "history = contextHistory,")
          s = s.replace("isError = providerResp.isError", "isError = providerResp.errorMessage != null")
          s = s.replace("prefs.currentMode == \"romantic_gf\"", "prefs.personality == \"romantic_gf\"")
          s = s.replace("OrbThemeColor.ROMANTIC_ROSE", "OrbThemeColor.ROSE_GOLD")
          s = s.replace("Icons.Default.Psychology", "Icons.Default.Build")
          if "import com.myra.assistant.ui.screens.MyraConnectScreen" not in s:
              s = s.replace("import com.myra.assistant.ui.screens.MainVoiceScreen",
                            "import com.myra.assistant.ui.screens.MainVoiceScreen\\nimport com.myra.assistant.ui.screens.MyraConnectScreen")
          p.write_text(s)

          p = root / "app/src/main/java/com/myra/assistant/provider/AIProviderManager.kt"
          s = p.read_text().replace(",\\n                        isError = true", "").replace(",\\n                    isError = true", "")
          p.write_text(s)

          p = root / "app/src/main/java/com/myra/assistant/offline/OfflineCommandEngine.kt"
          s = p.read_text().replace("val launched = appLauncher.launchAppByName(appName)",
                                    "val launched = appLauncher.launchAppByName(appName).success")
          p.write_text(s)

          p = root / "app/src/main/java/com/myra/assistant/offline/OfflineModeManager.kt"
          s = p.read_text().replace("var bytesRead: Int\\n", "var bytesRead: Int = 0\\n")
          p.write_text(s)

          p = root / "app/src/main/java/com/myra/assistant/provider/LocalModelProvider.kt"
          s = p.read_text().replace("LocalMemoryRepository.getInstance(context)", "LocalMemoryRepository(context)")
          s = s.replace("localMemoryRepo.getPersonalityIsolatedMemories(isCompanionMode, limit = 5)",
                        'localMemoryRepo.searchMemoriesIsolated("", if (isCompanionMode) "romantic_gf" else "friendly_assistant").take(5)')
          p.write_text(s)

          p = root / "app/src/main/java/com/myra/assistant/security/BiometricManager.kt"
          s = p.read_text().replace("com.google.code.gson", "com.google.gson")
          p.write_text(s)

          p = root / "app/src/main/java/com/myra/assistant/services/MyraWakeWordService.kt"
          s = p.read_text()
          imports = "import com.myra.assistant.MainActivity\\nimport com.myra.assistant.MyraApplication\\nimport com.myra.assistant.data.PreferencesManager\\nimport java.util.Locale\\n"
          if "import com.myra.assistant.MainActivity" not in s:
              s = s.replace("import android.app.Notification", imports + "import android.app.Notification")
          s = s.replace('                putExtra(RecognizerIntent.EXTRA_ADDITIONAL_LANGUAGES, arrayOf("en-IN", "en-US"))\\n', "")
          p.write_text(s)

          p = root / "app/src/main/java/com/myra/assistant/tools/ActionBrain.kt"
          s = p.read_text()
          s = s.replace("permissionManager.hasPermission(plan.requiredPermission)",
                        "androidx.core.content.ContextCompat.checkSelfPermission(context, plan.requiredPermission) == android.content.pm.PackageManager.PERMISSION_GRANTED")
          s = s.replace("deviceControlManager.toggleTorch(turnOn)", "deviceControlManager.toggleFlashlight(turnOn).success")
          s = s.replace("phoneCallManager.makeCall(target)", "phoneCallManager.handleCallCommand(target).success")
          s = s.replace("whatsAppAutomation.sendMessage(contact, message)",
                        "whatsAppAutomation.handleWhatsAppCommand(contact, message, autoSend = true).success")
          s = s.replace("val success = deviceControlManager.triggerEmergencySOS()",
                        "val success = false // SOS dispatch is not implemented; never claim success.")
          s = s.replace("Emergency SOS trigger kiya gaya aur contacts ko alert bheja gaya.",
                        "Emergency SOS सुविधा अभी इस build में उपलब्ध नहीं है।")
          s = s.replace("Emergency SOS triggered and emergency alerts sent.",
                        "Emergency SOS is not implemented in this build.")
          p.write_text(s)

          p = root / "app/src/main/java/com/myra/assistant/ui/theme/Color.kt"
          s = p.read_text()
          for name, expr in [("AccentRed", "Color(0xFFEF4444)"), ("AccentCyan", "CyanNeon"), ("PurpleNeon", "AccentIndigo")]:
              if f"val {name} =" not in s:
                  s += f"\\nval {name} = {expr}\\n"
          p.write_text(s)

          p = root / "app/src/main/java/com/myra/assistant/ui/screens/MainVoiceScreen.kt"
          s = p.read_text()
          s = s.replace("    val context = LocalContext.current\\n",
                        "    val context = LocalContext.current\\n    val prefs = remember { PreferencesManager(context) }\\n", 1)
          s = s.replace("                val prefs = remember { PreferencesManager(context) }\\n                val photoPath = prefs.customPhotoPath",
                        "                val photoPath = prefs.customPhotoPath")
          p.write_text(s)

          p = root / "app/src/main/java/com/myra/assistant/ui/screens/SecurityScreen.kt"
          s = p.read_text()
          if "import androidx.compose.foundation.clickable" not in s:
              s = s.replace("import androidx.compose.foundation.background",
                            "import androidx.compose.foundation.background\\nimport androidx.compose.foundation.clickable")
          p.write_text(s)

          p = root / "app/src/main/java/com/myra/assistant/vision/CameraVisionManager.kt"
          s = p.read_text()
          if "import java.io.IOException" not in s:
              s = s.replace("import java.io.File", "import java.io.File\\nimport java.io.IOException")
          p.write_text(s)

          p = root / "app/src/main/java/com/myra/assistant/voice/SystemSpeechEngine.kt"
          s = p.read_text().replace('                putExtra(RecognizerIntent.EXTRA_ADDITIONAL_LANGUAGES, arrayOf("en-IN", "en-US"))\\n', "")
          p.write_text(s)

          print("Dependency and source compatibility patches applied.")
          PY
      - name: Build main app
        working-directory: MYRA_SOURCE
        run: ./gradlew :app:clean :app:assembleDebug --no-daemon --stacktrace
      - name: Upload main APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-Main-APK-or-Build-Logs
          path: |
            MYRA_SOURCE/app/build/outputs/apk/debug/app-debug.apk
            MYRA_SOURCE/app/build/reports/
            MYRA_SOURCE/build/reports/
          if-no-files-found: warn
          retention-days: 14

  build-companion:
    name: Build MYRA Companion APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Extract source ZIP
        run: |
          unzip -q MYRA_EXTRACTED_SOURCE.zip -d MYRA_SOURCE
          chmod +x MYRA_SOURCE/MYRA_Companion_Project/gradlew
      - name: Build companion app
        working-directory: MYRA_SOURCE/MYRA_Companion_Project
        run: ./gradlew :app:clean :app:assembleDebug --no-daemon --stacktrace
      - name: Upload companion APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-Companion-APK-or-Build-Logs
          path: |
            MYRA_SOURCE/MYRA_Companion_Project/app/build/outputs/apk/debug/app-debug.apk
            MYRA_SOURCE/MYRA_Companion_Project/app/build/reports/
          if-no-files-found: warn
          retention-days: 14
