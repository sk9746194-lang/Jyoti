name: Build MYRA APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-main:
    name: Build MYRA Main APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Extract source ZIP
        run: |
          unzip -q MYRA_EXTRACTED_SOURCE.zip -d MYRA_SOURCE
          chmod +x MYRA_SOURCE/gradlew
      - name: Align dependencies and repair MYRA source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("MYRA_SOURCE")
          root_gradle = root / "build.gradle.kts"
          app_gradle = root / "app/build.gradle.kts"

          s = root_gradle.read_text()
          s = s.replace('id("org.jetbrains.kotlin.android") version "1.9.23" apply false',
                        'id("org.jetbrains.kotlin.android") version "2.3.0" apply false\n    id("org.jetbrains.kotlin.plugin.compose") version "2.3.0" apply false')
          root_gradle.write_text(s)

          s = app_gradle.read_text()
          if 'id("org.jetbrains.kotlin.plugin.compose")' not in s:
              s = s.replace('    id("org.jetbrains.kotlin.android")',
                            '    id("org.jetbrains.kotlin.android")\n    id("org.jetbrains.kotlin.plugin.compose")')
          s = s.replace('com.google.ai.edge.litertlm:litertlm-android:0.1.0',
                        'com.google.ai.edge.litertlm:litertlm-android:0.18.0')
          s = re.sub(r'    composeOptions\s*\{[^}]*\}\s*', '', s)
          s = re.sub(r'    kotlinOptions\s*\{\s*jvmTarget\s*=\s*"17"\s*\}',
                     '    kotlin { compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) } }', s)
          app_gradle.write_text(s)

          main = root / "app/src/main/java/com/myra/assistant/MainActivity.kt"
          lines = main.read_text().splitlines()
          req = next((i for i, line in enumerate(lines) if 'Request error: ${e.message}' in line), -1)
          if req >= 0:
              first = req
              while first > 0 and "val cancelMsg = ChatMessage(" not in lines[first]:
                  first -= 1
              state = next((i for i in range(req, min(req + 8, len(lines))) if "assistantState = AssistantState.IDLE" in lines[i]), -1)
              if first < req and state >= 0:
                  del lines[first:state + 3]
          s = "\n".join(lines) + "\n"
          if "import androidx.compose.ui.unit.dp" not in s:
              s = s.replace("import androidx.compose.ui.Modifier",
                            "import androidx.compose.ui.Modifier\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp\nimport androidx.compose.ui.text.font.FontWeight")
          s = s.replace('prefs.currentMode == "romantic_gf"', 'prefs.personality == "romantic_gf"')
          s = s.replace("OrbThemeColor.ROMANTIC_ROSE", "OrbThemeColor.ROSE_GOLD")
          main.write_text(s)

          security = root / "app/src/main/java/com/myra/assistant/ui/screens/SecurityScreen.kt"
          s = security.read_text()
          if "import androidx.compose.ui.unit.dp" not in s:
              s = s.replace("import androidx.compose.ui.Modifier",
                            "import androidx.compose.ui.Modifier\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp")
          security.write_text(s)

          colors = root / "app/src/main/java/com/myra/assistant/ui/theme/Color.kt"
          s = colors.read_text()
          if "val AccentCyan =" not in s:
              s += "\n// Compatibility aliases for screen color names.\nval AccentCyan = CyanNeon\nval PurpleNeon = AccentIndigo\n"
          colors.write_text(s)

          settings = root / "app/src/main/java/com/myra/assistant/ui/screens/SettingsScreen.kt"
          s = settings.read_text()
          s = s.replace("WhatsAppAutomation.isAccessibilityActive(context)", "WhatsAppAutomation(context).isAccessibilityActive()")
          s = s.replace("WhatsAppAutomation.isInstalled(context)", "WhatsAppAutomation(context).isInstalled()")
          s = s.replace("WhatsAppAutomation.openAccessibilitySettings(context)", "WhatsAppAutomation(context).openAccessibilitySettings()")
          settings.write_text(s)

          # Fix API/model mismatches found by the Kotlin compiler.
          p = root / "app/src/main/java/com/myra/assistant/MainActivity.kt"
          s = p.read_text()
          s = s.replace("history = contextHistory.map { it.sender to it.text },", "history = contextHistory,")
          s = s.replace("isError = providerResp.isError", "isError = providerResp.errorMessage != null")
          s = s.replace("prefs.currentMode == \"romantic_gf\"", "prefs.personality == \"romantic_gf\"")
          s = s.replace("OrbThemeColor.ROMANTIC_ROSE", "OrbThemeColor.ROSE_GOLD")
          s = s.replace("Icons.Default.Psychology", "Icons.Default.Build")
          if "import com.myra.assistant.ui.screens.MyraConnectScreen" not in s:
              s = s.replace("import com.myra.assistant.ui.screens.MainVoiceScreen",
                            "import com.myra.assistant.ui.screens.MainVoiceScreen\nimport com.myra.assistant.ui.screens.MyraConnectScreen")
          p.write_text(s)

          p = root / "app/src/main/java/com/myra/assistant/provider/AIProviderManager.kt"
          s = p.read_text().replace(",\n                        isError = true", "").replace(",\n                    isError = true", "")
          p.write_text(s)

          p = root / "app/src/main/java/com/myra/assistant/offline/OfflineCommandEngine.kt"
          s = p.read_text().replace("val launched = appLauncher.launchAppByName(appName)",
                                    "val launched = appLauncher.launchAppByName(appName).success")
          p.write_text(s)

          p = root / "app/src/main/java/com/myra/assistant/offline/OfflineModeManager.kt"
          s = p.read_text().replace("var bytesRead: Int\n", "var bytesRead: Int = 0\n")
          p.write_text(s)

          p = root / "app/src/main/java/com/myra/assistant/provider/LocalModelProvider.kt"
          s = p.read_text().replace("LocalMemoryRepository.getInstance(context)", "LocalMemoryRepository(context)")
          s = s.replace("localMemoryRepo.getPersonalityIsolatedMemories(isCompanionMode, limit = 5)",
                        'localMemoryRepo.searchMemoriesIsolated("", if (isCompanionMode) "romantic_gf" else "friendly_assistant").take(5)')
          p.write_text(s)

          p = root / "app/src/main/java/com/myra/assistant/security/BiometricManager.kt"
          s = p.read_text().replace("com.google.code.gson", "com.google.gson")
          p.write_text(s)

          p = root / "app/src/main/java/com/myra/assistant/services/MyraWakeWordService.kt"
          s = p.read_text()
          s = s.replace('rawSpeech.substring(idx + trig.length).trim(" ,.!?".toCharArray())', "rawSpeech.substring(idx + trig.length).trim(' ', ',', '.', '!', '?')")
          imports = "import com.myra.assistant.MainActivity\nimport com.myra.assistant.MyraApplication\nimport com.myra.assistant.data.PreferencesManager\nimport java.util.Locale\n"
          if "import com.myra.assistant.MainActivity" not in s:
              s = s.replace("import android.app.Notification", imports + "import android.app.Notification")
          s = s.replace('                putExtra(RecognizerIntent.EXTRA_ADDITIONAL_LANGUAGES, arrayOf("en-IN", "en-US"))\n', "")
          p.write_text(s)

          p = root / "app/src/main/java/com/myra/assistant/tools/ActionBrain.kt"
          s = p.read_text()
          s = s.replace("permissionManager.hasPermission(plan.requiredPermission)",
                        "androidx.core.content.ContextCompat.checkSelfPermission(context, plan.requiredPermission) == android.content.pm.PackageManager.PERMISSION_GRANTED")
          s = s.replace("deviceControlManager.toggleTorch(turnOn)", "deviceControlManager.toggleFlashlight(turnOn).success")
          s = s.replace("phoneCallManager.makeCall(target)", "phoneCallManager.handleCallCommand(target).success")
          s = s.replace("whatsAppAutomation.sendMessage(contact, message)",
                        "whatsAppAutomation.handleWhatsAppCommand(contact, message, autoSend = true).success")
          s = s.replace("val success = deviceControlManager.triggerEmergencySOS()",
                        "val success = false // SOS dispatch is not implemented; never claim success.")
          s = s.replace("Emergency SOS trigger kiya gaya aur contacts ko alert bheja gaya.",
                        "Emergency SOS सुविधा अभी इस build में उपलब्ध नहीं है।")
          s = s.replace("Emergency SOS triggered and emergency alerts sent.",
                        "Emergency SOS is not implemented in this build.")
          p.write_text(s)

          p = root / "app/src/main/java/com/myra/assistant/ui/theme/Color.kt"
          s = p.read_text()
          for name, expr in [("AccentRed", "Color(0xFFEF4444)"), ("AccentCyan", "CyanNeon"), ("PurpleNeon", "AccentIndigo")]:
              if f"val {name} =" not in s:
                  s += f"\nval {name} = {expr}\n"
          p.write_text(s)

          p = root / "app/src/main/java/com/myra/assistant/ui/screens/MainVoiceScreen.kt"
          s = p.read_text()
          s = s.replace("    val context = LocalContext.current\n",
                        "    val context = LocalContext.current\n    val prefs = remember { PreferencesManager(context) }\n", 1)
          s = s.replace("                val prefs = remember { PreferencesManager(context) }\n                val photoPath = prefs.customPhotoPath",
                        "                val photoPath = prefs.customPhotoPath")
          p.write_text(s)

          p = root / "app/src/main/java/com/myra/assistant/ui/screens/SecurityScreen.kt"
          s = p.read_text()
          if "import androidx.compose.foundation.clickable" not in s:
              s = s.replace("import androidx.compose.foundation.background",
                            "import androidx.compose.foundation.background\nimport androidx.compose.foundation.clickable")
          p.write_text(s)

          p = root / "app/src/main/java/com/myra/assistant/vision/CameraVisionManager.kt"
          s = p.read_text()
          if "import java.io.IOException" not in s:
              s = re.sub(r"^(package [^\n]+\n)", r"\1import java.io.IOException\n", s, count=1, flags=re.MULTILINE)
          p.write_text(s)

          p = root / "app/src/main/java/com/myra/assistant/voice/SystemSpeechEngine.kt"
          s = p.read_text()
          s = re.sub(r"(?m)^.*EXTRA_ADDITIONAL_LANGUAGES.*(?:\n|$)", "", s)
          p.write_text(s)

          # Correct the offline-model panel layout and benchmark state.
          p = root / "app/src/main/java/com/myra/assistant/ui/screens/SettingsScreen.kt"
          s = p.read_text()
          start = s.find('                            Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {')
          end = s.find('\n\n                            if (downloadStatus', start)
          if start >= 0 and end > start and 'Storage Available:' in s[start:end]:
              replacement = "\n".join([
                  "                            Column(modifier = Modifier.fillMaxWidth(), verticalArrangement = Arrangement.spacedBy(5.dp)) {",
                  "                                Text(\"Storage Available: ${metrics.freeStorageMb} MB\", color = TextSecondary, fontSize = 11.sp)",
                  "                                Text(\"Status: $statusMessage\", color = LightBlue, fontSize = 11.sp, modifier = Modifier.fillMaxWidth())",
                  "                            }"
              ])
              s = s[:start] + replacement + s[end:]
          anchor = '    var isRunningBenchmark by remember { mutableStateOf(false) }'
          if 'LaunchedEffect(selectedOfflineModel.modelId)' not in s and anchor in s:
              s = s.replace(anchor, anchor + '\n    LaunchedEffect(selectedOfflineModel.modelId) { benchmarkResult = null }', 1)
          old_lines = [
              '                                Text("• Speed: ${res.tokensPerSecond} tokens/sec (TTFT: ${res.timeToFirstTokenMs} ms)", color = LightBlue, fontSize = 10.sp)',
              '                                Text("• Threads: ${res.cpuThreadsUsed} • RAM: ${res.memoryUsageMb} MB • Thermal: ${res.thermalStatus}", color = TextSecondary, fontSize = 10.sp)'
          ]
          new_lines = [
              '                                if (res.generatedTokenCount > 0) {',
              '                                    Text("• Speed: ${res.tokensPerSecond} tokens/sec (TTFT: ${res.timeToFirstTokenMs} ms)", color = LightBlue, fontSize = 10.sp)',
              '                                    Text("• Generated tokens: ${res.generatedTokenCount}", color = TextSecondary, fontSize = 10.sp)',
              '                                } else {',
              '                                    Text("• Inference not completed: 0 tokens generated", color = LightBlue, fontSize = 10.sp)',
              '                                    Text("• Check that this model is downloaded and installed, then retry.", color = TextSecondary, fontSize = 10.sp)',
              '                                }',
              '                                Text("• Threads: ${res.cpuThreadsUsed} • Device RAM used: ${res.memoryUsageMb} MB • Thermal: ${res.thermalStatus}", color = TextSecondary, fontSize = 10.sp)'
          ]
          if old_lines[0] in s and old_lines[1] in s:
              s = s.replace(old_lines[0] + '\n' + old_lines[1], '\n'.join(new_lines), 1)
          p.write_text(s)
          print("Offline model screen layout and benchmark fixes applied.")
          print("Dependency and source compatibility patches applied.")
          PY
      - name: Fix offline routing and reliable Hindi-English TTS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("MYRA_SOURCE")
          main = root / "app/src/main/java/com/myra/assistant/MainActivity.kt"
          source = main.read_text()
          pattern = r'\n                    if \(!prefs\.hasConfiguredApiKey\) \{.*?\n                    \}\n\n                    val contextHistory'
          source, count = re.subn(pattern, '\n                    val contextHistory', source, count=1, flags=re.DOTALL)
          print("Removed API-key early return:", count)
          main.write_text(source)

          speech = root / "app/src/main/java/com/myra/assistant/voice/SystemSpeechEngine.kt"
          source = speech.read_text()
          if "private var pendingSpeech: Triple<String, Float, Float>? = null" not in source:
              source = source.replace(
                  "    private var activeUtteranceId: String? = null",
                  "    private var activeUtteranceId: String? = null\n    private var pendingSpeech: Triple<String, Float, Float>? = null\n    private var defaultEngineFallbackAttempted = false",
                  1
              )

          source = source.replace(
              '''        } else {
              Log.e(tag, "TextToSpeech initialization failed with status $status")
              onError(status, "TextToSpeech init failed")
          }''',
              '''        } else {
              Log.e(tag, "TextToSpeech initialization failed with status $status")
              if (!defaultEngineFallbackAttempted && !isDestroyed) {
                  defaultEngineFallbackAttempted = true
                  try {
                      tts?.shutdown()
                      tts = TextToSpeech(context.applicationContext, this)
                  } catch (e: Exception) {
                      onError(status, "TextToSpeech init failed: ${e.message}")
                  }
              } else {
                  onError(status, "TextToSpeech init failed")
              }
          }''',
              1
          )

          source = source.replace(
              "            isTtsReady = true",
              """            isTtsReady = true
              val queuedSpeech = pendingSpeech
              pendingSpeech = null
              if (queuedSpeech != null) {
                  mainHandler.post { speak(queuedSpeech.first, queuedSpeech.second, queuedSpeech.third) }
              }""",
              1
          )

          source = source.replace(
              '''            if (!isTtsReady || tts == null) {
                  Log.w(tag, "TTS not ready yet; attempting lazy initialization")
                  return@post
              }

              try {
                  tts?.setSpeechRate(rate.coerceIn(0.5f, 2.0f))''',
              '''            if (!isTtsReady || tts == null) {
                  pendingSpeech = Triple(cleanSpeech, rate, pitch)
                  Log.w(tag, "TTS initializing; response queued")
                  return@post
              }

              try {
                  val speechLocale = if (cleanSpeech.any { it in '\u0900'..'\u097F' }) Locale("hi", "IN") else Locale("en", "IN")
                  val languageStatus = tts?.setLanguage(speechLocale)
                  if (languageStatus == TextToSpeech.LANG_MISSING_DATA || languageStatus == TextToSpeech.LANG_NOT_SUPPORTED) {
                      Log.w(tag, "Speech locale unavailable: $speechLocale")
                  }
                  tts?.setSpeechRate(rate.coerceIn(0.5f, 2.0f))''',
              1
          )
          speech.write_text(source)
          print("Offline routing and TTS patches applied.")
          PY
      - name: Fix Gemma 3 gated download, exact artifact, and secure Hugging Face token
        working-directory: MYRA_SOURCE
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) The official repository requires accepting Gemma terms and authenticated file access.
          p = Path("app/src/main/java/com/myra/assistant/offline/OfflineModeManager.kt")
          s = p.read_text()
          s = s.replace('fileName = "Gemma3-1B-IT.litertlm",',
                        'fileName = "Gemma3-1B-IT_multi-prefill-seq_q4_ekv4096.litertlm",')
          s = s.replace('expectedSizeBytes = 688_157_792L, // 656.28 MB exact',
                        'expectedSizeBytes = 584_417_280L, // Official 584 MB Q4 LiteRT-LM artifact')
          s = s.replace('expectedSha256 = "62faebcfd101acb841c33249530430397e031eb17d4dd3d2a71193d135705f27",',
                        'expectedSha256 = "1325ae366d31950f137c9c357b9fa89448b176d76998180c08ceaca78bba98be",')
          s = s.replace('''        // Wi-Fi check
        if (isWifiOnlyDownload()''',
                        '''        // Gemma files are gated on Hugging Face. User must accept the Gemma terms
        // and provide their own read token; never embed a shared token in the APK.
        if (secureStorage.getHuggingFaceToken().isBlank()) {
            _downloadStatus.value = ModelDownloadStatus.FAILED
            _statusMessage.value = "Hugging Face token आवश्यक है। पहले Gemma license स्वीकार करें और अपना Read token सुरक्षित रूप से यहाँ सेव करें।"
            return
        }

        // Wi-Fi check
        if (isWifiOnlyDownload()''', 1)
          s = s.replace('''        val url = URL(targetModel.downloadUrl)
        var connection: HttpURLConnection? = null''',
                        '''        val url = URL(targetModel.downloadUrl)
        val hfToken = secureStorage.getHuggingFaceToken()
        var connection: HttpURLConnection? = null''', 1)
          s = s.replace('''                setRequestProperty("User-Agent", "MYRA-Assistant-Android/1.0 (Moto g34 5G)")
                if (existingBytes > 0)''',
                        '''                setRequestProperty("User-Agent", "MYRA-Assistant-Android/1.0")
                setRequestProperty("Authorization", "Bearer $hfToken")
                if (existingBytes > 0)''', 1)
          s = s.replace('''            if (!isOk && !isPartial) {
                val errorMsg = "HTTP Error $responseCode: ${connection.responseMessage}"''',
                        '''            if (responseCode == 401 || responseCode == 403) {
                _downloadStatus.value = ModelDownloadStatus.FAILED
                _statusMessage.value = "Hugging Face ने access रोका। ब्राउज़र में Gemma license स्वीकार करें और वैध Read token सेव करें।"
                return@withContext
            }

            if (!isOk && !isPartial) {
                val errorMsg = "HTTP Error $responseCode: ${connection.responseMessage}"''', 1)
          p.write_text(s)

          # 2) Store the user's Hugging Face token in the same encrypted Android Keystore vault.
          p = Path("app/src/main/java/com/myra/assistant/security/SecureKeyStorage.kt")
          s = p.read_text()
          s = s.replace('''        private const val KEY_GEMINI_API_KEY = "encrypted_gemini_api_key"''',
                        '''        private const val KEY_GEMINI_API_KEY = "encrypted_gemini_api_key"
        private const val KEY_HUGGING_FACE_TOKEN = "encrypted_hugging_face_read_token"''', 1)
          anchor = '''    /**
     * Optional custom server endpoint URL (e.g. user-hosted backend).
     */'''
          methods = '''    /** Stores the user's own Hugging Face read token encrypted on this device. */
    fun saveHuggingFaceToken(token: String) {
        securePrefs.edit().putString(KEY_HUGGING_FACE_TOKEN, token.trim()).apply()
    }

    fun getHuggingFaceToken(): String {
        return securePrefs.getString(KEY_HUGGING_FACE_TOKEN, "")?.trim() ?: ""
    }

    fun hasHuggingFaceToken(): Boolean = getHuggingFaceToken().isNotBlank()

    fun clearHuggingFaceToken() {
        securePrefs.edit().remove(KEY_HUGGING_FACE_TOKEN).apply()
    }

'''
          if "fun saveHuggingFaceToken" not in s:
              if anchor not in s:
                  raise SystemExit("SecureKeyStorage insertion anchor missing")
              s = s.replace(anchor, methods + anchor, 1)
          p.write_text(s)

          # 3) Add an in-app token field; token is entered on the phone, never in chat or source.
          p = Path("app/src/main/java/com/myra/assistant/ui/screens/SettingsScreen.kt")
          s = p.read_text()
          if "import com.myra.assistant.security.SecureKeyStorage" not in s:
              s = s.replace("import com.myra.assistant.provider.LocalModelBenchmarkResult",
                            "import com.myra.assistant.provider.LocalModelBenchmarkResult\nimport com.myra.assistant.security.SecureKeyStorage", 1)
          state_anchor = '''    val offlineMgr = remember { OfflineModeManager.getInstance(context) }'''
          state_add = '''    val secureKeyStorage = remember { SecureKeyStorage.getInstance(context) }
    var hfTokenInput by remember { mutableStateOf("") }
    val hasHfToken by remember { derivedStateOf { secureKeyStorage.hasHuggingFaceToken() } }
    val offlineMgr = remember { OfflineModeManager.getInstance(context) }'''
          if "var hfTokenInput by remember" not in s:
              if state_anchor not in s:
                  raise SystemExit("SettingsScreen offline state anchor missing")
              s = s.replace(state_anchor, state_add, 1)

          card_anchor = '''                    // Download & Storage Action Card'''
          card = '''                    // Gemma 3 files are gated: accept the official license and use a personal read token.
                    if (selectedOfflineModel.modelId == VerifiedModelCatalogue.GEMMA_3_1B_IT.modelId) {
                        Column(
                            modifier = Modifier.fillMaxWidth(),
                            verticalArrangement = Arrangement.spacedBy(6.dp)
                        ) {
                            Text(
                                "Gemma License / Hugging Face Access",
                                color = TextPrimary,
                                fontSize = 12.sp,
                                fontWeight = FontWeight.SemiBold
                            )
                            Text(
                                if (hasHfToken) "Hugging Face Read token इस डिवाइस में सुरक्षित है।"
                                else "पहले Hugging Face पर Gemma terms स्वीकार करें, फिर अपना Read token नीचे सेव करें।",
                                color = TextSecondary,
                                fontSize = 10.sp
                            )
                            OutlinedButton(
                                onClick = {
                                    context.startActivity(
                                        android.content.Intent(
                                            android.content.Intent.ACTION_VIEW,
                                            Uri.parse("https://huggingface.co/litert-community/Gemma3-1B-IT")
                                        )
                                    )
                                },
                                modifier = Modifier.fillMaxWidth()
                            ) {
                                Text("Open Official Gemma License Page", fontSize = 11.sp)
                            }
                            OutlinedTextField(
                                value = hfTokenInput,
                                onValueChange = { hfTokenInput = it },
                                modifier = Modifier.fillMaxWidth(),
                                singleLine = true,
                                label = { Text("Hugging Face Read token") },
                                placeholder = { Text("hf_••••••••") },
                                visualTransformation = PasswordVisualTransformation()
                            )
                            Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                Button(
                                    onClick = {
                                        if (hfTokenInput.trim().startsWith("hf_")) {
                                            secureKeyStorage.saveHuggingFaceToken(hfTokenInput)
                                            hfTokenInput = ""
                                            Toast.makeText(context, "Hugging Face token इस डिवाइस में सुरक्षित सेव हुआ", Toast.LENGTH_LONG).show()
                                        } else {
                                            Toast.makeText(context, "कृपया सही Hugging Face Read token डालें", Toast.LENGTH_LONG).show()
                                        }
                                    },
                                    modifier = Modifier.weight(1f)
                                ) { Text("Save Read Token", fontSize = 11.sp) }
                                OutlinedButton(
                                    onClick = {
                                        secureKeyStorage.clearHuggingFaceToken()
                                        hfTokenInput = ""
                                        Toast.makeText(context, "Hugging Face token हटाया गया", Toast.LENGTH_SHORT).show()
                                    }
                                ) { Text("Clear", fontSize = 11.sp) }
                            }
                        }
                    }

'''
          if "Gemma License / Hugging Face Access" not in s:
              if card_anchor not in s:
                  raise SystemExit("SettingsScreen download card anchor missing")
              s = s.replace(card_anchor, card + card_anchor, 1)
          p.write_text(s)
          print("Gemma gated-download and secure token patches applied.")
          PY
      - name: Build main app
        working-directory: MYRA_SOURCE
        run: ./gradlew :app:clean :app:assembleDebug --no-daemon --stacktrace
      - name: Upload main APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-Main-APK-or-Build-Logs
          path: |
            MYRA_SOURCE/app/build/outputs/apk/debug/app-debug.apk
            MYRA_SOURCE/app/build/reports/
            MYRA_SOURCE/build/reports/
          if-no-files-found: warn
          retention-days: 14

  build-companion:
    name: Build MYRA Companion APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Extract source ZIP
        run: |
          unzip -q MYRA_EXTRACTED_SOURCE.zip -d MYRA_SOURCE
          chmod +x MYRA_SOURCE/MYRA_Companion_Project/gradlew
      - name: Build companion app
        working-directory: MYRA_SOURCE/MYRA_Companion_Project
        run: ./gradlew :app:clean :app:assembleDebug --no-daemon --stacktrace
      - name: Upload companion APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-Companion-APK-or-Build-Logs
          path: |
            MYRA_SOURCE/MYRA_Companion_Project/app/build/outputs/apk/debug/app-debug.apk
            MYRA_SOURCE/MYRA_Companion_Project/app/build/reports/
          if-no-files-found: warn
          retention-days: 14
