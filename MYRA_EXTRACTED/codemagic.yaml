workflows:
  android-debug:
    name: MYRA Assistant Debug APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
      android_signing:
        - keystore_reference
      vars:
        PACKAGE_NAME: "com.myra.assistant"
    scripts:
      - name: Make Gradle wrapper executable
        script: |
          chmod +x gradlew
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build Android Debug APK
        script: |
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - sk9746194@gmail.com
        notify:
          failure: true
          success: true

  android-release:
    name: MYRA Assistant Release APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.myra.assistant"
    scripts:
      - name: Make Gradle wrapper executable
        script: |
          chmod +x gradlew
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build Android Release APK
        script: |
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
